name: Fix WDompet dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove search, fix period layout, enable theme toggle
        shell: python
        run: |
          from pathlib import Path
          p = Path('v2/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<button class="top-icon" aria-label="Cari">⌕</button>', '')
          s = s.replace('<button class="top-icon" aria-label="Tema">☼</button>', '<button id="themeToggle" class="top-icon" aria-label="Tema" title="Ubah tema">☼</button>')
          css = '''\n<style id="v22-dashboard-fix">\n/* Dashboard mobile audit fixes */\n@media(max-width:850px){\n  .welcome-actions{display:grid!important;grid-template-columns:34px minmax(0,1fr)!important;gap:7px!important;align-items:start!important}\n  .welcome-actions .monthpick{grid-column:1/-1!important;width:100%!important;margin:0!important}\n  .welcome-actions .monthpick select{width:100%!important;min-height:36px!important}\n}\n@media(max-width:520px){\n  .welcome-actions{grid-template-columns:34px minmax(0,1fr)!important}\n  .welcome-actions .monthpick select{min-height:38px!important}\n}\n/* Dark theme */\nbody.theme-dark{background:linear-gradient(135deg,#0b1220 0%,#101a2b 48%,#0d1b24 100%)!important;color:#e8eef7!important}\nbody.theme-dark .welcome h1,body.theme-dark .page-title h1,body.theme-dark h2{color:#e8eef7!important}\nbody.theme-dark .welcome p,body.theme-dark .page-title p,body.theme-dark .sectionhead p,body.theme-dark .eyebrow{color:#aab8ca!important}\nbody.theme-dark .top-icon{background:#172337!important;border-color:#2b3b51!important;color:#e7eef7!important}\nbody.theme-dark .monthpick select,body.theme-dark input,body.theme-dark select{background:#172337!important;border-color:#2b3b51!important;color:#e7eef7!important}\nbody.theme-dark .panel,body.theme-dark .quick-stats article{background:rgba(20,31,48,.96)!important;border-color:#2a394e!important}\nbody.theme-dark .tablewrap{color:#e7eef7!important}\nbody.theme-dark table th{color:#9fb0c4!important}\nbody.theme-dark table td{border-color:#26364b!important;color:#dce6f2!important}\nbody.theme-dark .empty{color:#9fb0c4!important}\n</style>\n'''
          if 'id="v22-dashboard-fix"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('v2/app.js')
          s = p.read_text(encoding='utf-8')
          marker = "$('exportBtn').addEventListener('click',exportCsv);"
          theme = "$('themeToggle').addEventListener('click',()=>{document.body.classList.toggle('theme-dark');localStorage.setItem('wdompet_theme',document.body.classList.contains('theme-dark')?'dark':'light');$('themeToggle').textContent=document.body.classList.contains('theme-dark')?'☀':'☼'});if(localStorage.getItem('wdompet_theme')==='dark'){document.body.classList.add('theme-dark');$('themeToggle').textContent='☀'}"
          if "$('themeToggle').addEventListener" not in s:
              s = s.replace(marker, theme + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/index.html v2/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix dashboard period layout and enable theme toggle"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-dashboard-theme.yml
          git commit -m "Remove temporary dashboard fix workflow"
          git push
