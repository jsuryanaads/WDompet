name: Fix WDompet V2.3 HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair dashboard markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v2/index.html')
          s=p.read_text(encoding='utf-8')
          bad='<section class="split"><section class="panel"><div class="sectionhead"><div><span class="eyebrow">PENGELUARAN</span><h2>Pengeluaran per Kategori</h2></div></div><div id="categoryChart" class="category-chart"></div></section><section class="panel"><div class="sectionhead"><div><span class="eyebrow">INSIGHT</span><h2>Insight Keuangan</h2></div></section><div id="insights" class="insights"></div></section>'
          good='<section class="split"><section class="panel"><div class="sectionhead"><div><span class="eyebrow">PENGELUARAN</span><h2>Pengeluaran per Kategori</h2></div></div><div id="categoryChart" class="category-chart"></div></section><section class="panel"><div class="sectionhead"><div><span class="eyebrow">INSIGHT</span><h2>Insight Keuangan</h2></div></div><div id="insights" class="insights"></div></section></section>'
          if bad in s:
              s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix V2.3 dashboard markup"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-v23-html.yml
          git commit -m "Remove temporary V2.3 HTML workflow"
          git push
