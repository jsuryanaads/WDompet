<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2343"><title>WDompet V2.4.1 — Tambah Transaksi</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="appbar"><div class="brand"><div class="brandmark" aria-label="WDompet logo">W</div><div><b>WDompet</b><span>Kelola Keuangan<br>Lebih Mudah</span></div></div><div class="appbar-actions"><span class="version">V2.4.1</span><button id="themeToggle" class="top-icon" type="button">☼</button></div></header>
<nav class="nav" aria-label="Navigasi utama"><a class="nav-item" href="index.html"><span class="nav-icon">⌂</span><small>Beranda</small></a><a class="nav-item" href="transaksi.html"><span class="nav-icon">☷</span><small>Transaksi</small></a><a class="nav-item active add-nav" href="tambah.html"><span class="nav-icon">＋</span><small>Tambah</small></a><a class="nav-item" href="anggaran.html"><span class="nav-icon">◫</span><small>Anggaran</small></a><a class="nav-item" href="laporan.html"><span class="nav-icon">▥</span><small>Laporan</small></a><a class="nav-item" href="sumber-dana.html"><span class="nav-icon">◉</span><small>Sumber Dana</small></a></nav>
<main class="container" style="max-width:760px;margin:22px auto 90px;padding:0 18px"><section class="page-title"><span class="eyebrow">TRANSAKSI</span><h1 id="formTitle">Tambah Transaksi</h1><p>Input pemasukan atau pengeluaran dan hubungkan dengan sumber dana.</p></section>
<section class="panel"><form id="form"><div class="form-grid"><label>Tanggal<input id="date" type="date" required></label><label>Jenis<select id="type"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></label><label>Kategori<input id="category" maxlength="60" placeholder="Contoh: Makanan" required></label><label>Nominal<input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="Rp 0" required></label><label>Sumber Dana<select id="fundSelect"><option value="">Tanpa sumber dana</option></select></label><label class="wide">Keterangan<input id="note" maxlength="120" placeholder="Catatan opsional"></label></div><div style="display:flex;gap:10px;margin-top:18px"><button id="saveTransaction" class="primary" type="submit">Simpan Transaksi</button><a class="button" href="transaksi.html">Batal</a></div></form></section></main><script src="app.js"></script></body></html>
