<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2343"><title>WDompet V2.5.0 — Sumber Dana</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-desktop.css"><link rel="stylesheet" href="theme-redesign.css"><link rel="stylesheet" href="sidebar-unified.css"><style>.funds-page{max-width:1160px;margin:22px auto 90px;padding:0 18px}.fund-form,.fund-list,.transfer-form{background:rgba(255,255,255,.96);border:1px solid #e2e9f2;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 10px 30px rgba(22,34,56,.045)}.fund-form h2,.transfer-form h2,.fund-list h2{margin:0 0 14px;font-size:18px;color:#182540}.fund-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fund-grid input,.fund-grid select{width:100%;min-height:40px;padding:11px;border:1px solid #dfe5ee;border-radius:11px;background:#fff;color:#27344b;font:inherit}.fund-actions,.transfer-actions{display:flex;gap:8px;margin-top:12px}.fund-table{width:100%;overflow:auto}.fund-table table{width:100%;min-width:650px;border-collapse:collapse}.fund-table th,.fund-table td{padding:12px 9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap;font-size:11px}.fund-table th{font-size:9px;color:#7c879b;text-transform:uppercase;letter-spacing:.5px}.fund-badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eaf3ff;color:#2673cf;font-weight:800}.fund-balance{font-weight:800}.transfer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.transfer-grid label{display:block}.transfer-grid input,.transfer-grid select{width:100%;min-height:40px;margin-top:5px}.transfer-note{grid-column:1/-1}body.theme-dark .fund-form,body.theme-dark .fund-list,body.theme-dark .transfer-form{background:rgba(20,31,48,.96);border-color:#2a394e}body.theme-dark .fund-form h2,body.theme-dark .transfer-form h2,body.theme-dark .fund-list h2{color:#eef5ff}body.theme-dark .fund-grid input,body.theme-dark .fund-grid select{background:#172337;border-color:#2b3b51;color:#e7eef7}body.theme-dark .fund-table td{border-color:#26364b;color:#dce6f2}body.theme-dark .fund-table th{color:#9fb0c4}@media(max-width:850px){.funds-page{width:calc(100% - 20px);margin:18px auto 86px;padding:0}.fund-form,.fund-list,.transfer-form{padding:16px;border-radius:18px}.fund-grid,.transfer-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fund-grid,.transfer-grid{grid-template-columns:1fr}.fund-table table{min-width:620px}.fund-table th,.fund-table td{font-size:8px;padding:9px}.funds-page .page-title h1{font-size:25px}}</style></head><body><header class="appbar"><div class="brand"><img class="brand-logo" src="wdompet-logo.svg" alt="Logo WDompet"><div><b>WDompet</b><span>Kelola Keuangan<br>Lebih Mudah</span></div></div><div class="appbar-actions"><span class="version">V2.5.0</span><button id="exportBtn" class="iconbtn" type="button" aria-label="Export CSV">⇩</button></div></header><nav class="nav" aria-label="Navigasi utama"><a class="nav-item" href="index.html"><small>Beranda</small></a><a class="nav-item" href="transaksi.html"><small>Transaksi</small></a><a class="nav-item add-nav" href="tambah.html" aria-label="Tambah transaksi"><small>Tambah</small></a><a class="nav-item" href="anggaran.html"><small>Anggaran</small></a><a class="nav-item" href="laporan.html"><small>Laporan</small></a><a class="nav-item active" href="sumber-dana.html"><small>Sumber Dana</small></a><button id="themeToggle" class="nav-item theme-button" type="button" aria-label="Ubah tema">☼ Tema</button></nav><main class="funds-page"><section class="page-title"><span class="eyebrow">SUMBER DANA</span><h1>Kelola Sumber Dana</h1><p>Bank, e-wallet, tunai, dan sumber dana lainnya.</p></section><section class="fund-form"><h2>Tambah Sumber Dana</h2><div class="fund-grid"><input id="fundName" placeholder="Nama sumber dana" maxlength="60" autocomplete="off" aria-label="Nama sumber dana"><select id="fundType" aria-label="Jenis sumber dana"><option value="bank">Bank</option><option value="ewallet">E-Wallet</option><option value="cash">Tunai</option><option value="other">Lainnya</option></select><input id="fundOpening" type="number" min="0" inputmode="numeric" placeholder="Saldo awal" aria-label="Saldo awal"><input id="fundMasked" placeholder="Nomor/keterangan (opsional)" maxlength="40" aria-label="Nomor atau keterangan"></div><div class="fund-actions"><button id="saveFund" class="primary" type="button">Simpan Sumber Dana</button></div></section><section class="transfer-form"><h2>Transfer Antar Sumber Dana</h2><div class="transfer-grid"><label>Dari<select id="transferFrom"></select></label><label>Ke<select id="transferTo"></select></label><label>Nominal<input id="transferAmount" type="number" min="1" inputmode="numeric" placeholder="Rp 0"></label><label>Tanggal<input id="transferDate" type="date"></label><label class="transfer-note">Keterangan<input id="transferNote" maxlength="120" placeholder="Catatan opsional"></label></div><div class="transfer-actions"><button id="saveTransfer" class="primary" type="button">Simpan Transfer</button></div></section><section class="fund-list"><div class="sectionhead"><div><h2>Daftar Sumber Dana</h2><p id="fundMeta">0 sumber dana</p></div></div><div id="fundList" class="fund-table"></div></section></main><footer>Created Jsuryana • V2.5.0</footer><script src="app.js"></script></body></html>
