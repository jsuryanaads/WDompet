<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2343">
<title>WDompet V2.4 — Sumber Dana</title>
<link rel="stylesheet" href="style.css">
<style>
.funds-page{max-width:1160px;margin:22px auto 90px;padding:0 18px}.fund-form,.fund-list{background:rgba(255,255,255,.94);border:1px solid #e4ebf3;border-radius:20px;padding:20px;margin-top:16px}.fund-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fund-grid input,.fund-grid select,.fund-grid button{width:100%;min-height:40px}.fund-actions{display:flex;gap:8px;margin-top:12px}.fund-actions button{padding:10px 16px}.fund-table{width:100%;overflow:auto}.fund-table table{width:100%;min-width:650px;border-collapse:collapse}.fund-table th,.fund-table td{padding:12px;border-bottom:1px solid #e6edf5;text-align:left;white-space:nowrap}.fund-badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#edf6ff}.fund-balance{font-weight:800}.fund-empty{text-align:center;padding:28px;color:#748399}.fund-del{border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.fund-nav{margin-top:10px}
@media(max-width:850px){.funds-page{margin:12px auto 86px;padding:0 10px}.fund-form,.fund-list{padding:14px;border-radius:18px}.fund-grid{grid-template-columns:1fr 1fr}.fund-grid .wide{grid-column:1/-1}}
@media(max-width:520px){.fund-grid{grid-template-columns:1fr}.fund-grid .wide{grid-column:auto}.fund-table table{min-width:620px}.fund-table th,.fund-table td{font-size:11px;padding:9px}.fund-form h1{font-size:22px}}
body.theme-dark .fund-form,body.theme-dark .fund-list{background:rgba(20,31,48,.96);border-color:#2a394e}body.theme-dark .fund-table td{border-color:#26364b}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><div class="brandmark" aria-label="WDompet logo">W</div><div><b>WDompet</b><span>Kelola Keuangan<br>Lebih Mudah</span></div></div>
  <div class="appbar-actions"><span class="version">V2.4</span><button id="exportBtn" class="iconbtn" aria-label="Export CSV">⇩</button></div>
</header>
<nav class="nav" aria-label="Navigasi utama">
  <a class="nav-item" href="index.html"><span class="nav-icon">⌂</span><small>Beranda</small></a>
  <a class="nav-item" href="transaksi.html"><span class="nav-icon">☷</span><small>Transaksi</small></a>
  <a class="nav-item add-nav" href="tambah.html"><span class="nav-icon">＋</span><small>Tambah</small></a>
  <a class="nav-item" href="anggaran.html"><span class="nav-icon">◫</span><small>Anggaran</small></a>
  <a class="nav-item" href="laporan.html"><span class="nav-icon">▥</span><small>Laporan</small></a>
  <a class="nav-item active" href="sumber-dana.html"><span class="nav-icon">◉</span><small>Sumber Dana</small></a>
</nav>
<main class="funds-page">
  <section class="page-title"><span class="eyebrow">SUMBER DANA</span><h1>Kelola Sumber Dana</h1><p>Catat rekening bank, e-wallet, tunai, dan sumber dana lainnya.</p></section>
  <section class="fund-form">
    <h2>Tambah Sumber Dana</h2>
    <div class="fund-grid">
      <input id="fundName" class="wide" placeholder="Nama sumber dana" maxlength="60" autocomplete="off">
      <select id="fundType"><option value="bank">Bank</option><option value="ewallet">E-Wallet</option><option value="cash">Tunai</option><option value="other">Lainnya</option></select>
      <input id="fundOpening" type="number" min="0" inputmode="numeric" placeholder="Saldo awal">
      <input id="fundMasked" placeholder="Nomor/keterangan (opsional)" maxlength="40">
    </div>
    <div class="fund-actions"><button id="saveFund" class="primary">Simpan</button><button id="themeToggle" class="top-icon" type="button">☼</button></div>
  </section>
  <section class="fund-list"><div class="sectionhead"><div><h2>Daftar Sumber Dana</h2><p id="fundMeta">0 sumber dana</p></div></div><div id="fundList" class="fund-table"></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
