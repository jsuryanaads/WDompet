<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2343"><title>WDompet — Masuk</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-desktop.css"><link rel="stylesheet" href="theme-redesign.css"><link rel="stylesheet" href="sidebar-unified.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:rgba(255,255,255,.97);border:1px solid #e2e9f2;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(22,34,56,.1)}.login-brand{text-align:center;margin-bottom:24px}.login-brand img{width:72px;height:72px}.login-brand h1{margin:12px 0 4px}.login-brand p{margin:0;color:#68738a;font-size:12px}.login-card form{display:grid;gap:12px}.login-card label{display:grid;gap:6px;font-size:11px;font-weight:800}.login-card input{width:100%;min-height:44px;padding:11px 13px;border:1px solid #dfe5ee;border-radius:11px;background:#fff;font:inherit}.login-actions{display:grid;gap:8px;margin-top:4px}.login-switch{border:0;background:none;cursor:pointer;color:#2875d0;font:inherit;font-size:11px}.login-msg{min-height:18px;font-size:11px;text-align:center;color:#c34b4b}.login-note{text-align:center;color:#7b8799;font-size:10px;margin-top:14px}body.theme-dark .login-card{background:#141f30;border-color:#2a394e}body.theme-dark .login-brand p,body.theme-dark .login-note{color:#aebed0}body.theme-dark .login-card input{background:#172337;border-color:#2b3b51;color:#e7eef7}</style></head><body><main class="login-card"><div class="login-brand"><img src="wdompet-logo.svg" alt="Logo WDompet"><h1>WDompet</h1><p>Kelola keuangan lebih mudah</p></div><form id="authForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="nama@email.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimal 6 karakter"></label><div id="loginMsg" class="login-msg"></div><div class="login-actions"><button id="submitBtn" class="primary" type="submit">Masuk</button><button id="switchBtn" class="login-switch" type="button">Belum punya akun? Daftar</button></div></form><div class="login-note">Data WDompet akan disimpan secara aman di Supabase.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config-v3.js"></script><script src="auth-gate.js"></script><script>(function(){const cfg=window.WDOMPET_SUPABASE||{};const msg=document.getElementById('loginMsg'),form=document.getElementById('authForm'),submit=document.getElementById('submitBtn'),sw=document.getElementById('switchBtn');let signup=false;if(!window.supabase||!cfg.url||!cfg.key){msg.textContent='Supabase gagal dimuat. Muat ulang halaman.';return}if(!window.wdompetSupabase)window.wdompetSupabase=window.supabase.createClient(cfg.url,cfg.key);function setMode(){submit.textContent=signup?'Daftar':'Masuk';sw.textContent=signup?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';document.getElementById('password').autocomplete=signup?'new-password':'current-password'}sw.onclick=()=>{signup=!signup;msg.textContent='';setMode()};form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Memproses...';submit.disabled=true;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const redirectTo=new URL('login.html',location.href).href;let r=signup?await wdompetSupabase.auth.signUp({email,password,options:{emailRedirectTo:redirectTo}}):await wdompetSupabase.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;submit.disabled=false;return}if(signup&&!r.data.session){msg.textContent='Pendaftaran berhasil. Periksa email untuk konfirmasi, lalu masuk.';submit.disabled=false;signup=false;setMode();return}location.replace('index.html')})})()</script></body></html>
